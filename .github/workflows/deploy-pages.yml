# GitHub Pages 静态部署：web/ 页面 + output/ 结果一起发布
# 触发：main 分支推送（含上面两个工作流的自动提交）
# 首次使用：Settings → Pages → Source 选 "Gi  tHub Actions"
name: 发布页面

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装静态站点（web 页面 + 回测结果）
        run: |
          mkdir -p _site
          cp -r web/* _site/
          rm -f _site/test_rsi.js
          cp -r output _site/output

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
