# 手动回测：workflow_dispatch 触发，跑全部标的×全部策略并更新 output/
name: 手动回测

on:
  workflow_dispatch:
    inputs:
      start:
        description: "回测起点（默认 2022-01-01）"
        required: false
        default: "2022-01-01"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行回测
        env:
          PROVIDER_ORDER: "eastmoney,csindex,tencent,akshare"
        run: |
          python run.py backtest --all --start "${{ github.event.inputs.start || '2022-01-01' }}"
          python run.py signal --all --force

      - name: 提交回测结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || (git commit -m "chore(action): 更新回测结果 output/" && git push)
