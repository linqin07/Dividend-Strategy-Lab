# 每日数据刷新：自动拉取最新行情 → 重算回测与信号 → 提交 output/。
# output/ 一提交就会触发 deploy-pages.yml 重新发布，GitHub Pages 页面数据随之每天更新。
#
# 重要：GitHub Actions 的 cron 一律按 UTC 计算，与仓库/账号时区无关。
#   cron "13 16 * * *"  = UTC 16:13 = 北京时间 次日 00:13（午夜刷新，拿到的是上一交易日收盘数据）
#   cron "35 8 * * 1-5" = UTC 08:35 = 北京时间 工作日 16:35（收盘后刷新，能拿到当日数据）
# 两条可按需保留：只要午夜更新就删掉第二条。
name: 每日数据刷新

on:
  schedule:
    - cron: "13 16 * * *"    # 北京时间每天 00:13
    - cron: "35 8 * * 1-5"   # 北京时间工作日 16:35（可选，收盘后更新当日数据）
  workflow_dispatch:         # 手动触发：Actions → 每日数据刷新 → Run workflow

permissions:
  contents: write

# 多个工作流都会写 output/，用同一并发组排队执行，避免互相踩踏
concurrency:
  group: output-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # 让 datetime.now() / 缓存新鲜度判断 / output 里的 computed_at 都按北京时间
      TZ: Asia/Shanghai
      # 数据源链（CI 中去掉 tdx，避免额外依赖）
      PROVIDER_ORDER: "eastmoney,csindex,tencent,akshare"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取最新行情并重算回测 + 信号
        run: |
          python run.py backtest --all --force --start "2022-01-01"
          python run.py signal --all --force

      - name: 校验数据新鲜度（拉取失败则中止，不提交脏数据）
        run: python scripts/check_output_freshness.py

      - name: 提交 output 并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "output/ 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(action): 每日自动刷新 output/ ($(date '+%Y-%m-%d %H:%M'))"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被拒绝（远程有新提交），rebase 后重试 ($i/3)..."
            git fetch origin master
            git rebase -X ours --empty=drop origin/master || { git rebase --abort; exit 1; }
            sleep 5
          done
          echo "重试 3 次后仍推送失败"
          exit 1
